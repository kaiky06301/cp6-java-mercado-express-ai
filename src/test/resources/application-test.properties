# Perfil de testes: banco H2 em memória (não precisa de PostgreSQL)
# e provedor de IA simulado nos testes (não precisa de rede, créditos ou Ollama)
spring.datasource.url=jdbc:h2:mem:cp6;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
