# Spring
spring.application.name=mercado-express-ai
server.port=${PORT:8080}

# PostgreSQL local (container na porta 5434 - ver docker-compose.yml e scripts/)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/mercado_express_ai}
spring.datasource.username=${DB_USERNAME:mercado}
spring.datasource.password=${DB_PASSWORD:mercado123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Spring AI - Ollama local (sem chave de API)
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:qwen2.5:3b}
spring.ai.ollama.chat.temperature=0.2
spring.ai.ollama.chat.repeat-penalty=1.2
# falha rápido quando o Ollama está fora do ar (em vez de várias tentativas)
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s

# Nome do provedor gravado no histórico
assistente.provedor=Ollama

# Limites: tamanho máximo da resposta (tokens) e tempo de espera do modelo
spring.ai.ollama.chat.num-predict=350
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=90s
